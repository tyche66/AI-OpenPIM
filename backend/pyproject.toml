[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "smoke: smoke e2e tests",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency and parameter declarations intentionally use calls as defaults.
"app/api/v1/*.py" = ["B008"]
"app/core/permission.py" = ["B008"]
# Generated Prometheus-style metric reset blocks contain long dict comprehensions by design.
"app/observability/metrics.py" = ["E501"]
"app/scripts/import_sunon_products.py" = ["E501"]
# Alembic migration files: preserve original formatting to keep diffs reviewable.
"alembic/versions/*.py" = ["E501"]
# alembic/env.py intentionally injects CI defaults before importing settings (E402 by design).
"alembic/env.py" = ["E402"]
# Long inline literal tables and config strings in knowledge subsystem.
"app/knowledge/model_gateway.py" = ["E501"]
"app/knowledge/policy.py" = ["E501"]
"app/knowledge/tools/quality.py" = ["E501"]
"tests/test_media_and_permissions.py" = ["E501"]
# Long inline literal tables, regex patterns, and external API contract strings.
# _iter_minio_object keeps a try/finally release around the stream, so UP028 cannot apply.
"app/api/v1/files.py" = ["E501", "UP028"]
"app/knowledge/pricing.py" = ["E501"]
"app/knowledge/sessions.py" = ["E501"]
"app/knowledge/tools/product.py" = ["E501"]
"app/adapters/openai.py" = ["E501"]
"app/api/v1/products.py" = ["E501"]
"app/api/v1/quotations.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
